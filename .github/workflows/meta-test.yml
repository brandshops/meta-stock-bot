{"name": "Meta test", "on": "workflow_dispatch", "jobs": {"test": {"runs-on": "ubuntu-latest", "steps": [{"run": "mkdir t && cd t && npm init -y >/dev/null && npm i playwright >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1 && cat > t.js <<'EOFJS'\nconst { chromium } = require('playwright');\n(async () => {\n  const b = await chromium.launch();\n  const urls = ['https://www.meta.com/ae/ai-glasses/ray-ban-meta-gen-2/','https://www.meta.com/in/ai-glasses/shop-all/','https://www.meta.com/gb/ai-glasses/shop-all/','https://www.meta.com/us/ai-glasses/shop-all/','https://www.amazon.ae/dp/B0CZ5G3XZ2'];\n  for (const u of urls) {\n    const c = await b.newContext({ userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36', locale: 'en-US' });\n    const p = await c.newPage();\n    try {\n      const r = await p.goto(u, { waitUntil: 'domcontentloaded', timeout: 45000 });\n      await p.waitForTimeout(8000);\n      const t = (await p.innerText('body')).replace(/\\s+/g, ' ');\n      const pr = (t.match(/(?:AED|USD|INR|GBP|\\$|\u00a3|\u20b9|Rs\\.?)\\s?[\\d.,]{2,10}/g) || []).slice(0, 6);\n      console.log('RESULT', u, 'HTTP', r.status(), 'title:', await p.title(), '| prices:', pr.join(' ; '), '| stock words:', (t.match(/(Add to bag|Add to cart|Sold out|Out of stock|Coming soon|Buy now|Notify me)/gi) || []).slice(0, 4).join(','), '| blocked:', /captcha|access denied|robot/i.test(t));\n    } catch (e) { console.log('RESULT', u, 'ERROR', e.message.slice(0, 120)); }\n    await c.close();\n  }\n  await b.close();\n})();\nEOFJS\nnode t.js | tee ../result.txt"}]}}}
