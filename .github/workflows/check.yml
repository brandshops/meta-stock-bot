{"name": "Check stock", "on": {"schedule": [{"cron": "0 */6 * * *"}], "workflow_dispatch": null}, "jobs": {"check": {"runs-on": "ubuntu-latest", "timeout-minutes": 300, "steps": [{"uses": "actions/checkout@v4"}, {"name": "Run", "env": {"WP_KEY": "${{ secrets.WP_KEY }}"}, "run": "set -e\nmkdir w && cd w\ncp ../*.zip . 2>/dev/null || true\ncp ../*.json . 2>/dev/null || true\ncp ../run.js .\nmkdir x\nunzip -oq \"$(ls *.zip | head -1)\" -d x\nd=$(dirname \"$(find x -name manifest.json | head -1)\")\nmv \"$d\" ext\nnpm init -y >/dev/null\nnpm i playwright >/dev/null 2>&1\nnpx playwright install --with-deps chromium >/dev/null 2>&1\nxvfb-run -a node run.js"}]}}}
